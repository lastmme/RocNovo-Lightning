[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rocnovo_lightning"
version = "1.0.0"
description = "A Lightning-based deep learning framework for de novo peptide sequencing"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Peng Xiong", email = "pengx@mail.ustc.edu.cn" },
    { name = "Hongtao Xu", email = "xht020521@mail.ustc.edu.cn" }
]
dependencies = [
    "numpy>=1.26.4,<2.0.0",
    "pandas>=2.2.3",
    "lightning>=2.5.1",
    "pytorch-lightning>=2.5.1",
    "biopython>=1.86",
    "einops>=0.8.1",
    "pyteomics>=4.7.5",
    "tqdm>=4.67.1",
    "loguru>=0.7.3",
    "jinja2>=3.1.6",
    "spectrum-utils>=0.4.2",
    "h5py>=3.13.0",
    "click>=8.1.8",
    "pyarrow>=19.0.1",
    "scikit-learn>=1.6.1",
    "tensorboard>=2.20.0",
    "ruamel.yaml>=0.17.21"
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rocnovo*"]
exclude = ["tutorials*", "yamls*", "docs*", "benchmarks*"]

[project.scripts]
rocnovo = "rocnovo.rocnovo:main"